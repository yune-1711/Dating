<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8efe7"><title>CozyDating</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8efe7;color:#493d37;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;background:linear-gradient(#fffaf6,#f8efe7);padding-bottom:90px}.top{padding:24px 20px 12px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:24px}.sub{font-size:13px;color:#8b7770}.card{margin:12px 16px;padding:18px;border-radius:26px;background:#fff;box-shadow:0 10px 30px #6b51401a}.hero{min-height:210px;background:linear-gradient(135deg,#ead7c8,#f6e9de);display:flex;flex-direction:column;justify-content:flex-end}.pill{display:inline-flex;padding:7px 11px;border-radius:999px;background:#f2e2d6;color:#765e53;font-size:12px}.name{font-size:28px;font-weight:800;margin:8px 0}.muted{color:#8b7770}.row{display:flex;gap:10px;align-items:center}.grow{flex:1}.avatar{width:56px;height:56px;border-radius:50%;background:#dfc4b3;display:grid;place-items:center;font-weight:800}.chat{height:58vh;overflow:auto;padding:12px}.bubble{max-width:82%;padding:11px 14px;border-radius:20px;margin:8px 0;line-height:1.4}.me{margin-left:auto;background:#b98f7a;color:white;border-bottom-right-radius:7px}.ai{background:white;border-bottom-left-radius:7px}.composer{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);width:min(520px,100%);padding:10px 14px;background:#fffaf6ee;backdrop-filter:blur(12px);display:flex;gap:8px}.composer input{flex:1;border:1px solid #e7d8ce;border-radius:22px;padding:12px 14px;outline:0}.send,.primary{background:#8d6655;color:#fff;border-radius:20px;padding:11px 16px}.secondary{background:#f2e2d6;color:#765e53;border-radius:20px;padding:11px 16px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:64px;background:#fffdfbf2;backdrop-filter:blur(15px);display:flex;justify-content:space-around;border-top:1px solid #eadfd8}.nav button{background:none;color:#8b7770;font-size:11px;padding:8px}.nav b{display:block;font-size:20px;margin-bottom:2px}.hide{display:none}.field{width:100%;padding:13px;border:1px solid #e7d8ce;border-radius:16px;margin:6px 0;outline:0}.err{color:#a34d4d;font-size:13px}.thought{padding:12px 14px;background:#faf3ee;border-radius:16px;margin:7px 0;font-size:14px}.list button{width:100%;text-align:left;background:#fff;padding:14px;border-radius:18px;margin:5px 0;border:0}.choice{padding:12px;border:1px solid #ead8cc;border-radius:16px;margin:8px 0;background:#fff}.loading{padding:20px;text-align:center;color:#8b7770}
</style></head><body><main class="app"><section id="auth" class="card" style="margin-top:80px"><div class="pill">COZY DATING · BETA</div><h1>Gặp một người,<br>không phải một chatbot.</h1><p class="muted">Một thế giới nơi những nhân vật AI có cuộc sống, ký ức và cảm xúc riêng.</p><input id="email" class="field" placeholder="Email"><input id="pass" class="field" type="password" placeholder="Mật khẩu"><div class="row"><button class="primary grow" onclick="auth('signin')">Đăng nhập</button><button class="primary grow" onclick="auth('signup')">Đăng ký</button></div><p id="authErr" class="err"></p></section><section id="home" class="hide"><header class="top"><div><div class="brand">CozyDating ☕</div><div class="sub">Một góc nhỏ dành cho những cuộc gặp gỡ.</div></div><button onclick="logout()">↪</button></header><div id="content"></div></section></main><nav id="nav" class="nav hide"><button onclick="home()"><b>⌂</b>Home</button><button onclick="discover()"><b>♡</b>Discover</button><button onclick="openChat()"><b>☵</b>Chat</button><button onclick="profile()"><b>◯</b>Profile</button></nav><script>
let token=localStorage.getItem('cozy_token'),selected=null,msgs=[],chars=[];const $=id=>document.getElementById(id);
function api(path,body){const c=new AbortController();const t=setTimeout(()=>c.abort(),60000);return fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined,signal:c.signal}).then(async r=>{let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}).catch(e=>{if(e.name==='AbortError')throw Error('Yêu cầu mất quá nhiều thời gian. Có thể Gemini đang bận — thử lại nhé.');throw e}).finally(()=>clearTimeout(t))}
async function auth(mode){try{const d=await api('/api/auth/'+mode,{email:$('email').value.trim(),password:$('pass').value});token=d.access_token;localStorage.setItem('cozy_token',token);showApp()}catch(e){$('authErr').textContent=e.message}}
function showApp(){$('auth').classList.add('hide');$('home').classList.remove('hide');$('nav').classList.remove('hide');home()}
function logout(){localStorage.removeItem('cozy_token');location.reload()}
async function loadChars(){const d=await api('/api/characters');chars=d.characters||[];selected=selected&&chars.find(c=>c.id===selected.id)||chars[0];return chars}
async function home(){try{await loadChars();if(!chars.length)return autoGenerate();$('content').innerHTML=`<div class="card hero"><span class="pill">${esc(chars[0].current_activity||'Đang sống cuộc sống riêng')}</span><div class="name">${esc(chars[0].name)}</div><div>${esc(chars[0].profile?.bio||'Một người đang chờ được làm quen.')}</div></div><div class="card"><div class="pill">AI đã chọn cho bạn</div><h2>${chars.length} người đang chờ gặp</h2><p class="muted">Mỗi người có tính cách, cuộc sống và cách yêu khác nhau.</p><button class="primary" onclick="discover()">Khám phá</button></div>`}catch(e){$('content').innerHTML='<div class="card err">'+esc(e.message)+'</div>'}}
let generating=false;
function autoGenerate(){if(generating)return;generating=true;$('content').innerHTML='<div class="card loading"><div class="pill">✦ COZY AI</div><h2>Đang tìm những người cậu có thể thích...</h2><p class="muted">Tớ đang tạo một nhóm nhân vật riêng cho cậu — mỗi người có tính cách, cuộc sống và cách nói chuyện khác nhau.</p><div class="thought">Không cần tự tạo nhân vật. Cứ để họ xuất hiện và tự tìm hiểu nhau.</div></div>';generateAI({auto:true}).finally(()=>{generating=false})}
async function generateAI(opts={}){try{const prefs={personality:'',life:'',vibe:''};const msg=opts.auto?'AI đang tạo nhóm nhân vật đầu tiên cho cậu... ☕':'AI đang tạo một nhóm người thật khác nhau cho cậu... ☕';$('content').innerHTML='<div class="card loading"><div class="pill">✦ COZY AI</div><h2>'+msg+'</h2><p class="muted">Đang nghĩ về tính cách, cuộc sống và cách họ nói chuyện.</p><p class="muted">Thường mất vài giây. Nếu quá lâu, app sẽ báo lỗi để cậu thử lại.</p></div>';const d=await api('/api/characters/generate',{preferences:prefs});chars=d.characters||[];selected=chars[0]||null;if(!chars.length)throw Error('AI chưa tạo được nhân vật nào.');home()}catch(e){$('content').innerHTML='<div class="card"><div class="pill">✦ COZY AI</div><h2>Chưa gọi được nhóm nhân vật</h2><p class="err">'+esc(e.message)+'</p><button class="primary" onclick="autoGenerate()">✦ Thử lại</button></div>'}}
function onboarding(){autoGenerate()}
async function openChat(){if(!selected)return discover();const d=await api('/api/chat/history',{character_id:selected.id}).catch(()=>({messages:[]}));msgs=d.messages||[];renderChat()}
function renderChat(){$('content').innerHTML=`<div class="top"><button onclick="discover()">‹</button><div><b>${esc(selected.name)}</b><div class="sub">${esc(selected.current_mood?.label||'đang online')}</div></div><span class="pill">${esc(selected.current_activity?.label||'life')}</span></div><div id="chat" class="chat">${msgs.map(m=>`<div class="bubble ${m.role==='user'?'me':'ai'}">${esc(m.content)}</div>`).join('')}</div><div class="composer"><input id="msg" placeholder="Nhắn gì đó..." onkeydown="if(event.key==='Enter')sendMsg()"><button class="send" onclick="sendMsg()">➤</button></div>`;scrollChat()}
async function sendMsg(){let v=$('msg').value.trim();if(!v)return;$('msg').value='';msgs.push({role:'user',content:v});renderChat();try{let d=await api('/api/chat',{character_id:selected.id,message:v});msgs.push({role:'assistant',content:d.reply});renderChat()}catch(e){msgs.push({role:'assistant',content:'...Tớ bị mất kết nối một chút. Thử lại nhé.'});renderChat()}}
function creator(){onboarding()}
function profile(){$('content').innerHTML='<div class="top"><div><div class="brand">Profile</div><div class="sub">Góc nhỏ của bạn.</div></div></div><div class="card"><h2>CozyDating Beta</h2><p class="muted">AI tạo nhân vật theo sở thích của bạn.</p><div class="thought">Database · Auth · Gemini · Character World</div><button class="secondary" onclick="autoGenerate()">Tìm một nhóm nhân vật khác</button></div>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]))}function scrollChat(){setTimeout(()=>{let c=$('chat');if(c)c.scrollTop=c.scrollHeight},0)}if(token)showApp();
</script></body></html>
