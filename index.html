`<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8efe7"><title>CozyDating</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8efe7;color:#493d37;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}button,input,textarea{font:inherit}button{border:0}.app{max-width:520px;margin:auto;min-height:100vh;background:linear-gradient(#fffaf6,#f8efe7);padding-bottom:90px}.top{padding:24px 20px 12px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:24px}.sub{font-size:13px;color:#8b7770}.card{margin:12px 16px;padding:18px;border-radius:26px;background:#fff;box-shadow:0 10px 30px #6b51401a}.hero{min-height:190px;background:linear-gradient(135deg,#ead7c8,#f6e9de);display:flex;flex-direction:column;justify-content:flex-end}.pill{display:inline-flex;padding:7px 11px;border-radius:999px;background:#f2e2d6;color:#765e53;font-size:12px}.name{font-size:28px;font-weight:800;margin:8px 0}.muted{color:#8b7770}.row{display:flex;gap:10px;align-items:center}.grow{flex:1}.avatar{width:56px;height:56px;border-radius:50%;background:#dfc4b3;display:grid;place-items:center;font-weight:800}.chat{height:58vh;overflow:auto;padding:12px}.bubble{max-width:82%;padding:11px 14px;border-radius:20px;margin:8px 0;line-height:1.4}.me{margin-left:auto;background:#b98f7a;color:white;border-bottom-right-radius:7px}.ai{background:white;border-bottom-left-radius:7px}.composer{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);width:min(520px,100%);padding:10px 14px;background:#fffaf6ee;backdrop-filter:blur(12px);display:flex;gap:8px}.composer input{flex:1;border:1px solid #e7d8ce;border-radius:22px;padding:12px 14px;outline:0}.send,.primary{background:#8d6655;color:#fff;border-radius:20px;padding:11px 16px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:64px;background:#fffdfbf2;backdrop-filter:blur(15px);display:flex;justify-content:space-around;border-top:1px solid #eadfd8}.nav button{background:none;color:#8b7770;font-size:11px;padding:8px}.nav b{display:block;font-size:20px;margin-bottom:2px}.hide{display:none}.field{width:100%;padding:13px;border:1px solid #e7d8ce;border-radius:16px;margin:6px 0;outline:0}.err{color:#a34d4d;font-size:13px}.thought{padding:12px 14px;background:#faf3ee;border-radius:16px;margin:7px 0;font-size:14px}.list button{width:100%;text-align:left;background:#fff;padding:14px;border-radius:18px;margin:5px 0}
</style></head><body><main class="app"><section id="auth" class="card" style="margin-top:80px"><div class="pill">COZY DATING · BETA</div><h1>Gặp một người,<br>không phải một chatbot.</h1><p class="muted">Một thế giới nơi những nhân vật AI có cuộc sống, ký ức và cảm xúc riêng.</p><input id="email" class="field" placeholder="Email"><input id="pass" class="field" type="password" placeholder="Mật khẩu"><div class="row"><button class="primary grow" onclick="auth('signin')">Đăng nhập</button><button class="primary grow" onclick="auth('signup')">Đăng ký</button></div><p id="authErr" class="err"></p></section><section id="home" class="hide"><header class="top"><div><div class="brand">CozyDating ☕</div><div class="sub">Một góc nhỏ dành cho những cuộc gặp gỡ.</div></div><button onclick="logout()">↪</button></header><div id="content"></div></section></main><nav id="nav" class="nav hide"><button onclick="home()"><b>⌂</b>Home</button><button onclick="discover()"><b>♡</b>Discover</button><button onclick="openChat()"><b>☵</b>Chat</button><button onclick="profile()"><b>◯</b>Profile</button></nav><script>
let token=localStorage.getItem('cozy_token'), selected=null, msgs=[];
const $=id=>document.getElementById(id);
function api(path,body){return fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined}).then(async r=>{let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d})}
async function auth(mode){try{const d=await api('/api/auth/'+mode,{email:$('email').value.trim(),password:$('pass').value});token=d.access_token;localStorage.setItem('cozy_token',token);showApp()}catch(e){$('authErr').textContent=e.message}}
function showApp(){$('auth').classList.add('hide');$('home').classList.remove('hide');$('nav').classList.remove('hide');home()}
function logout(){localStorage.removeItem('cozy_token');location.reload()}
async function home(){let cs=await api('/api/characters');selected=selected||cs[0];$('content').innerHTML=selected?`<div class="card hero"><span class="pill">${label(selected.current_activity,'Đang ở đâu đó trong thành phố')}</span><div class="name">${selected.name}</div><div>${selected.profile?.bio||selected.personality?.summary||'Một người đang chờ được làm quen.'}</div></div><div class="card"><div class="pill">Cảm xúc hiện tại</div><h2>${label(selected.current_mood,'bình yên')}</h2><div class="thought">“Hôm nay có lẽ sẽ là một ngày khá bình thường... cho đến khi có tin nhắn của bạn.”</div><button class="primary" onclick="openChat()">Nhắn cho ${selected.name}</button></div>`:`<div class="card"><h2>Chưa có nhân vật</h2><p class="muted">Hãy tạo nhân vật đầu tiên của thế giới này.</p><button class="primary" onclick="creator()">Tạo nhân vật</button></div>`}
async function discover(){let cs=await api('/api/characters');$('content').innerHTML='<div class="top"><div><div class="brand">Discover</div><div class="sub">Không cần swipe. Chỉ cần gặp đúng người.</div></div></div><div class="card list">'+(cs.length?cs.map((c,i)=>`<button onclick="selectChar(${i})"><div class="row"><div class="avatar">${(c.name||'?')[0]}</div><div><b>${c.name}</b><div class="muted">${label(c.current_activity,'Đang sống cuộc sống riêng')}</div></div></div></button>`).join(''):'<p class="muted">Chưa có character active.</p>')+'</div>';window._cs=cs}
function selectChar(i){selected=window._cs[i];home()}
async function openChat(){if(!selected)return discover();msgs=await api('/api/chat/history',{character_id:selected.id}).catch(()=>({messages:[]}));msgs=msgs.messages||[];renderChat()}
function renderChat(){$('content').innerHTML=`<div class="top"><button onclick="home()">‹</button><div><b>${selected.name}</b><div class="sub">${label(selected.current_mood,'đang online')}</div></div><span class="pill">${label(selected.current_activity,'life')}</span></div><div id="chat" class="chat">${msgs.map(m=>`<div class="bubble ${m.role==='user'?'me':'ai'}">${esc(m.content)}</div>`).join('')}</div><div class="composer"><input id="msg" placeholder="Nhắn gì đó..." onkeydown="if(event.key==='Enter')sendMsg()"><button class="send" onclick="sendMsg()">➤</button></div>`;$('msg').focus();scrollChat()}
async function sendMsg(){let v=$('msg').value.trim();if(!v)return;$('msg').value='';msgs.push({role:'user',content:v});renderChat();try{let d=await api('/api/chat',{character_id:selected.id,message:v});msgs.push({role:'assistant',content:d.reply||'...'});renderChat()}catch(e){console.error(e);msgs.push({role:'assistant',content:'[Backend lỗi] '+(e.message||'Không thể kết nối.')});renderChat()}}
function creator(){
$('content').innerHTML='<div class="top"><div><div class="brand">Tạo nhân vật ✦</div><div class="sub">Một người mới bước vào thế giới của bạn.</div></div></div><div class="card"><div class="pill">PROFILE</div><input id="cn" class="field" placeholder="Tên nhân vật"><input id="cb" class="field" placeholder="Một câu giới thiệu ngắn"><textarea id="cl" class="field" rows="3" placeholder="Công việc / cuộc sống / hoàn cảnh"></textarea><div class="pill">PERSONALITY</div><input id="cp" class="field" placeholder="Ví dụ: điềm tĩnh, hài hước, tinh tế"><input id="cs" class="field" placeholder="Cách nói chuyện: tự nhiên, ngắn gọn, ấm áp..."><div class="pill">PREFERENCES</div><input id="clike" class="field" placeholder="Thích: cà phê, chó, chạy bộ..."><input id="cdis" class="field" placeholder="Không thích / điều dễ khiến họ khó chịu"><div class="pill">APPEARANCE</div><input id="ca" class="field" placeholder="Ngoại hình: tóc, mắt, chiều cao, phong cách..."><button class="primary" onclick="saveCharacter()">Tạo nhân vật</button><p id="creatorErr" class="err"></p></div>'
}
async function saveCharacter(){try{let name=$('cn').value.trim();if(!name)throw Error('Hãy nhập tên nhân vật.');let d=await api('/api/characters',{name:name,profile:{bio:$('cb').value.trim()},background:{life:$('cl').value.trim()},personality:{traits:$('cp').value.trim(),communication:$('cs').value.trim()},preferences:{likes:$('clike').value.trim(),dislikes:$('cdis').value.trim()},appearance:{description:$('ca').value.trim()},current_mood:{label:'bình yên'},current_activity:{label:'đang rảnh'}});selected=d.character;home()}catch(e){$('creatorErr').textContent=e.message}}
function profile(){$('content').innerHTML='<div class="top"><div><div class="brand">Profile</div><div class="sub">Góc nhỏ của bạn.</div></div></div><div class="card"><h2>CozyDating Beta</h2><p class="muted">Tài khoản đã kết nối với Supabase Auth.</p><div class="thought">Database · Auth · Gemini · Character World</div></div>'}
function esc(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]))}function scrollChat(){setTimeout(()=>{let c=$('chat');if(c)c.scrollTop=c.scrollHeight},0)}
if(token)showApp();
</script></body></html>
